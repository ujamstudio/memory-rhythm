[project]
name = "memory-rhythm-backend"
version = "0.1.0"
description = "Memory Rhythm — dementia cognitive-companion AI web demo backend (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    # OpenAI is optional at runtime: only imported when an openai capability is selected.
    "openai>=1.30",
    # Google SDKs are likewise optional at runtime — imported LAZILY only when a
    # google capability is selected + credentialed. The mock demo needs neither.
    "google-genai>=0.3",          # Gemini API: LLM + Image(Imagen) + Embedding
    "google-cloud-speech>=2.21",  # Google Cloud Speech-to-Text (STT)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

# The demo boots with AI_PROVIDER=mock and STORE=memory — no API key, no DB.
# Run (from the backend/ directory):
#   uv run uvicorn app.main:app --reload --port 8000

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
